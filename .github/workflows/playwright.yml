name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: Automationframework

    env:
      CI: true
      ENV: dev
      BROWSER: chromium

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Automationframework/package-lock.json

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install

      - name: Run tests
        run: npm test

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            Automationframework/playwright-report/
            Automationframework/allure-report/
            Automationframework/test-results/
            Automationframework/allure-results/
          if-no-files-found: warn
          retention-days: 14
